openapi: 3.0.3
info:
  title: Coherent Spark API (unofficial)
  description: |
    API specifications for Coherent Spark platform (extracted from the TypeScript SDK).
    This specification documents all available endpoints for managing folders, services,
    batches, execution logs, imports/exports, and transforms.
  version: 1.0.0
  contact:
    name: Coherent Global
    url: https://docs.coherent.global

servers:
  - url: https://excel.{env}.coherent.global/{tenant}
    description: Spark environment
    variables:
      env:
        default: uat.us
        description: Environment name (e.g., uat.us, us, uat.eu, eu)
      tenant:
        default: my-tenant
        description: Tenant name
  - url: https://excel.{env}.coherent.global
    description: Only valid for APIv1 endpoints (tenant is provided in the body)
    variables:
      env:
        default: uat.us

tags:
  - name: Health
    description: Health check and platform configuration
  - name: Folders
    description: Folder (product) management operations
  - name: Services
    description: Service (engine) management and execution
  - name: Batches
    description: Asynchronous batch processing
  - name: History
    description: Service execution logs and history
  - name: ImportExport
    description: Import and export of Spark entities
  - name: Transforms
    description: Transform document management
  - name: OAuth2
    description: OAuth2 token generation

security:
  - ApiKeyAuth: []
  - BearerAuth: []
  - OAuth2: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check health status
      description: Checks the health status or connectivity of a Spark environment
      security:
        - {}
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/v1/config/GetSparkConfiguration:
    get:
      tags:
        - Health
      summary: Get platform configuration
      description: Returns the configuration of the Spark environment
      responses:
        '200':
          description: Platform configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/product/create:
    post:
      tags:
        - Folders
      summary: Create folder
      description: Creates a new folder (product)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - Name
                - Category
                - StartDate
                - LaunchDate
                - Status
              properties:
                Name:
                  type: string
                Category:
                  type: string
                  enum:
                    [
                      Medical,
                      Critical Illness,
                      Lifelong Participation,
                      Universal Life,
                      Investment Linked,
                      Annuity,
                      Term,
                      VHIS,
                      VHIS + Medical,
                      Property & Casualty,
                      Other,
                    ]
                Description:
                  type: string
                StartDate:
                  type: string
                  format: date-time
                LaunchDate:
                  type: string
                  format: date-time
                Status:
                  type: string
                  default: Design
                coverImage:
                  type: string
                  format: binary
      responses:
        '200':
          description: Folder created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderLocation'
        '409':
          description: Folder already exists
        '400':
          description: Bad request

  /api/v1/product/list:
    post:
      tags:
        - Folders
      summary: Find folders
      description: Finds folders by name, status, category, or favorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      value:
                        type: string
                page:
                  type: integer
                  default: 1
                pageSize:
                  type: integer
                  default: 100
                sort:
                  type: string
                  default: '-updated'
                shouldFetchActiveServicesCount:
                  type: boolean
                  default: true
      responses:
        '200':
          description: List of folders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListed'

  /api/v1/product/update/{folderId}:
    post:
      tags:
        - Folders
      summary: Update folder
      description: Updates a folder's information
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                category:
                  type: string
                startDate:
                  type: string
                  format: date-time
                launchDate:
                  type: string
                  format: date-time
                shouldTrackUserAction:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Folder updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderUpdated'

  /api/v1/product/delete/{folderId}:
    delete:
      tags:
        - Folders
      summary: Delete folder
      description: |
        Deletes a folder by ID (WARNING: This will also delete all its services).
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Folder deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderDeleted'

  /api/v1/product/UploadCoverImage:
    post:
      tags:
        - Folders
      summary: Upload folder cover image
      description: Uploads a cover image to a folder
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - id
                - coverImage
              properties:
                id:
                  type: string
                coverImage:
                  type: string
                  format: binary
      responses:
        '200':
          description: Cover image uploaded successfully

  /api/v1/lookup/getcategories:
    get:
      tags:
        - Folders
      summary: List categories
      description: Gets the list of folder categories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FolderCategory'

  /api/v1/lookup/savecategory:
    post:
      tags:
        - Folders
      summary: Save category
      description: Saves or updates a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                key:
                  type: string
                icon:
                  type: string
                  default: other.svg
      responses:
        '200':
          description: Category saved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FolderCategory'

  /api/v1/lookup/deletecategory/{key}:
    delete:
      tags:
        - Folders
      summary: Delete category
      description: Deletes a category by key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category deleted successfully

  /api/v3/folders/{folder}/services/{service}/upload:
    post:
      tags:
        - Services
      summary: Upload and initiate compilation
      description: Uploads a service file and initiates the compilation process
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - engineUploadRequestEntity
                - serviceFile
              properties:
                engineUploadRequestEntity:
                  type: object
                  properties:
                    request_data:
                      type: object
                      properties:
                        version_difference:
                          type: string
                          enum: [major, minor, patch]
                        effective_start_date:
                          type: string
                          format: date-time
                        effective_end_date:
                          type: string
                          format: date-time
                serviceFile:
                  type: string
                  format: binary
      responses:
        '200':
          description: Service uploaded and compilation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCompiled'

  /api/v3/folders/{folder}/services/{service}/getcompilationprogess/{jobId}:
    get:
      tags:
        - Services
      summary: Get compilation status
      description: Gets the status of a compilation job
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compilation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompilationStatus'

  /api/v3/folders/{folder}/services/{service}/publish:
    post:
      tags:
        - Services
      summary: Publish service
      description: Publishes a service after uploading and compiling it
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - request_data
              properties:
                request_data:
                  type: object
                  required:
                    - original_file_documentid
                    - engine_file_documentid
                  properties:
                    draft_service_name:
                      type: string
                    effective_start_date:
                      type: string
                      format: date-time
                    effective_end_date:
                      type: string
                      format: date-time
                    original_file_documentid:
                      type: string
                    engine_file_documentid:
                      type: string
                    version_difference:
                      type: string
                      enum: [major, minor, patch]
                    should_trck_user_action:
                      type: string
                    version_label:
                      type: string
                    release_note:
                      type: string
                    tags:
                      type: string
      responses:
        '200':
          description: Service published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePublished'

  /api/v3/folders/{folder}/services/{service}/execute:
    post:
      tags:
        - Services
      summary: Execute service
      description: Executes a service with the provided inputs
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_data:
                  type: object
                  properties:
                    inputs:
                      type: object
                      additionalProperties: true
                request_meta:
                  type: object
                  additionalProperties: true
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Service execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceExecuted'

  /api/v4/public/execute:
    post:
      tags:
        - Services
      summary: Execute service (batch mode)
      description: Executes a service in synchronous batch mode (v4 API)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                service:
                  type: string
                version_id:
                  type: string
                version_by_timestamp:
                  type: string
                  format: date-time
                subservice:
                  type: string
                output:
                  type: string
                call_purpose:
                  type: string
                source_system:
                  type: string
                correlation_id:
                  type: string
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Batch execution result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v3/folders/{folder}/services/{service}/validation:
    post:
      tags:
        - Services
      summary: Validate service inputs
      description: Validates the inputs for a service
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_data:
                  type: object
                  properties:
                    inputs:
                      type: object
                      additionalProperties: true
                request_meta:
                  type: object
                  properties:
                    validation_type:
                      type: string
                      enum: [dynamic, default_values]
                    transaction_date:
                      type: string
                      format: date-time
                    call_purpose:
                      type: string
                    source_system:
                      type: string
                    correlation_id:
                      type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceExecuted'

  /api/v3/folders/{folder}/services/{service}/metadata:
    get:
      tags:
        - Services
      summary: Get service metadata
      description: Gets the metadata of a Spark service
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataFound'

  /api/v1/product/{folder}/engines/get/{service}:
    get:
      tags:
        - Services
      summary: Get service schema
      description: Gets the schema for a service
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service schema
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /GetEngineDetailByVersionId/versionid/{versionId}:
    post:
      tags:
        - Services
      summary: Get service schema by version ID
      description: Gets the schema for a service by version ID
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service schema
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/product/{folder}/engines/getversions/{service}:
    get:
      tags:
        - Services
      summary: Get service versions
      description: Gets the list of versions of a Spark service
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionInfo'

  /api/v3/folders/{folder}/services/{service}/downloadswagger/{subservice}/{downloadable}/{versionId}:
    get:
      tags:
        - Services
      summary: Get Swagger documentation
      description: Gets the Swagger documentation of a Spark service
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: subservice
          in: path
          required: true
          schema:
            type: string
            default: All
        - name: downloadable
          in: path
          required: true
          schema:
            type: boolean
            default: false
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            default: ''
      responses:
        '200':
          description: Swagger documentation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/v3/services/search:
    post:
      tags:
        - Services
      summary: Search services
      description: Searches for services with pagination and filtering options
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_data:
                  type: object
                  properties:
                    page:
                      type: integer
                      default: 1
                    page_size:
                      type: integer
                      default: -1
                    sort:
                      type: string
                      default: name1_co
                    search:
                      type: array
                      items:
                        type: object
                    fields:
                      type: array
                      items:
                        type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListed'

  /api/v1/product/{folder}/engines/{service}/download/{versionId}:
    get:
      tags:
        - Services
      summary: Download service file
      description: Downloads the original (Excel) or configured file
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            default: ''
        - name: filename
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: ['', withmetadata]
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/v3/folders/{folder}/services/{service}/recompileNodgen:
    post:
      tags:
        - Services
      summary: Recompile service
      description: Recompiles a service using a specific compiler version
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - request_data
              properties:
                request_data:
                  type: object
                  properties:
                    versionId:
                      type: string
                    releaseNotes:
                      type: string
                    upgradeType:
                      type: string
                      enum: [major, minor, patch]
                    neuronCompilerVersion:
                      type: string
                      default: StableLatest
                    tags:
                      type: string
                    versionLabel:
                      type: string
                    effectiveStartDate:
                      type: string
                      format: date-time
                    effectiveEndDate:
                      type: string
                      format: date-time
      responses:
        '200':
          description: Recompilation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRecompiled'

  /api/v1/product/{folder}/engines/delete/{service}:
    delete:
      tags:
        - Services
      summary: Delete service
      description: Deletes a Spark service
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDeleted'

  /api/v4/transforms/{folder}/{service}/for/folders/{targetFolder}/services/{targetService}:
    post:
      tags:
        - Services
      summary: Execute service with transforms
      description: Executes a service using transforms for preprocessing and postprocessing
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: targetFolder
          in: path
          required: true
          schema:
            type: string
        - name: targetService
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Transform execution result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v4/batch/status:
    get:
      tags:
        - Batches
      summary: Describe batch pipelines
      description: Describes the batch pipelines available across the tenant
      responses:
        '200':
          description: Batch pipeline details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDescribed'

  /api/v4/batch:
    post:
      tags:
        - Batches
      summary: Create batch pipeline
      description: Creates a batch pipeline for asynchronous execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service
              properties:
                service:
                  type: string
                version_id:
                  type: string
                version_by_timestamp:
                  type: string
                  format: date-time
                subservice:
                  type: string
                output:
                  type: string
                call_purpose:
                  type: string
                  default: Async Batch Execution
                source_system:
                  type: string
                correlation_id:
                  type: string
                unique_record_key:
                  type: string
                initial_workers:
                  type: integer
                max_workers:
                  type: integer
                chunks_per_request:
                  type: integer
                runner_thread_count:
                  type: integer
                max_input_size_in_mb:
                  type: integer
                max_output_size_in_mb:
                  type: integer
                acceptable_error_percentage:
                  type: integer
      responses:
        '200':
          description: Batch pipeline created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreated'

  /api/v4/batch/{batchId}:
    get:
      tags:
        - Batches
      summary: Get batch information
      description: Gets batch information
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchInfo'
    patch:
      tags:
        - Batches
      summary: Dispose batch pipeline
      description: Disposes a batch pipeline (closes or cancels it)
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - batch_status
              properties:
                batch_status:
                  type: string
                  enum: [closed, cancelled]
      responses:
        '200':
          description: Batch pipeline disposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDisposed'

  /api/v4/batch/{batchId}/status:
    get:
      tags:
        - Batches
      summary: Get batch status
      description: Gets the status of a batch pipeline
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStatus'

  /api/v4/batch/{batchId}/chunks:
    post:
      tags:
        - Batches
      summary: Push data to batch pipeline
      description: Pushes data to a batch pipeline
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chunks
              properties:
                chunks:
                  type: array
                  items:
                    $ref: '#/components/schemas/BatchChunk'
      responses:
        '200':
          description: Records submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSubmitted'

  /api/v4/batch/{batchId}/chunkresults:
    get:
      tags:
        - Batches
      summary: Pull batch results
      description: Pulls the results from a batch pipeline
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
        - name: max
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Batch results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'

  /api/v3/log/getexecutionhistorybycallid/{callId}:
    get:
      tags:
        - History
      summary: Get detailed log
      description: Retrieves detailed logs of a service execution
      parameters:
        - name: callId
          in: path
          required: true
          schema:
