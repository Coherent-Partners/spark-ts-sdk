                                type: string
                              service_uri_destination:
                                type: string
                              update_version_type:
                                type: string
                                enum: [major, minor, patch]
                    services_existing:
                      type: string
                      enum: [abort, replace, add_version]
                    source_system:
                      type: string
                    correlation_id:
                      type: string
                file:
                  type: string
                  format: binary
