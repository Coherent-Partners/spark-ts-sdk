  /api/v4/export:
    post:
      tags:
        - ImportExport
      summary: Initiate export
      description: Initiates an export job to export Spark entities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inputs
              properties:
                inputs:
                  type: object
                  properties:
                    folders:
                      type: array
                      items:
                        type: string
                    services:
                      type: array
                      items:
                        type: string
                    version_ids:
                      type: array
                      items:
                        type: string
                file_filter:
                  type: string
                  enum: [migrate, onpremises]
                  default: migrate
                version_filter:
                  type: string
                  enum: [latest, all]
                  default: latest
                source_system:
                  type: string
                correlation_id:
                  type: string
      responses:
        '200':
          description: Export job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportInit'

