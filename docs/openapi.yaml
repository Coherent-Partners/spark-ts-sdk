              type: integer
            no_of_inputs:
              type: integer
            no_of_outputs:
              type: integer
            no_of_formulas:
              type: integer
            no_of_cellswithdata:
              type: integer
        response_meta:
          type: object
        error:
          type: object
          nullable: true

    CompilationStatus:
      type: object
      properties:
        status:
          type: string
        response_data:
          type: object
          properties:
            status:
              type: string
