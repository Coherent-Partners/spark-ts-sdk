      description: Generates an OAuth2 access token using client credentials
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - client_id
                - client_secret
              properties:
                grant_type:
                  type: string
                  default: client_credentials
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-synthetic-key
      description: API key (synthetic key) for authentication
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token for authentication
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /protocol/openid-connect/token
          scopes: {}

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: UP

    FolderLocation:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            folderId:
              type: string
            get_product_url:
              type: string
        errorCode:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    FolderListed:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/FolderInfo'
        count:
          type: integer
        next:
          type: integer
        previous:
          type: integer
        errorCode:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    FolderInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        category:
          type: string
        description:
          type: string
        coverImagePath:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        lastModifiedDate:
          type: string
        isStarred:
          type: boolean
        kanbanStatus:
          type: string
        startDate:
          type: string
        launchDate:
          type: string
        activeServiceCount:
          type: integer
        totalServiceCount:
          type: integer

    FolderCategory:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        icon:
          type: string

    FolderUpdated:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          nullable: true
        errorCode:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    FolderDeleted:
